version: '3.8'

services:
  # Main PFIS application (Express API + Embedded SPA)
  pfis-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pfis_platform
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - APP_MODE=demo
      - DEMO_MODE=true
      - DB_MODE=embedded
      - MAP_PROVIDER=openstreetmap
      - AI_PROVIDER=deterministic
      - STORAGE_PROVIDER=local
      - JWT_SECRET=pfis_production_secure_jwt_secret_token_change_in_real_deployments
      - CLIENT_URL=http://localhost:5000
    volumes:
      - pfis_data:/app/server/data
      - pfis_uploads:/app/server/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Optional PostgreSQL container for relational database profile
  postgres:
    image: postgres:16-alpine
    container_name: pfis_postgres
    restart: unless-stopped
    profiles:
      - postgres
    environment:
      POSTGRES_USER: pfis_user
      POSTGRES_PASSWORD: pfis_password
      POSTGRES_DB: pfis_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  # Optional Local LLM container for offline AI
  ollama:
    image: ollama/ollama:latest
    container_name: pfis_ollama
    restart: unless-stopped
    profiles:
      - ai
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  pfis_data:
    driver: local
  pfis_uploads:
    driver: local
  pg_data:
    driver: local
  ollama_data:
    driver: local
